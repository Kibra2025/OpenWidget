name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and run regression checks
        shell: powershell
        run: .\build.ps1 -RunTests
      - name: Verify portable packaging
        shell: powershell
        run: .\publish.ps1 -SkipBuild
